name: Feature request
description: Suggest a useful improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Describe the user or business problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem should this feature solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the expected experience or result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any workarounds or other approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add references, sketches or screenshots without confidential information.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request does not contain private client information or secrets.
          required: true

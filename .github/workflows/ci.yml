name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Lint source
        run: npm run lint -- --no-cache

      - name: Build static website
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::group::Build failure details"
            tail -n 180 build.log
            echo "::endgroup::"
            exit "$code"
          fi
          tail -n 80 build.log
